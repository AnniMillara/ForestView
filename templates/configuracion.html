{% extends "base.html" %}

{% block title %}Configuración{% endblock %}
{% block category %}SISTEMA{% endblock %}
{% block page_title %}Configuración{% endblock %}

{% block content %}
<div class="page-heading">
    <span>SISTEMA</span>
    <h2>Configuración</h2>
    <p>Preferencias del sistema ForestGuard.</p>
</div>

<div class="settings-grid">
    <div class="panel">
        <div class="panel-header">
            <div>
                <span class="panel-label">SISTEMA</span>
                <h3>Preferencias</h3>
            </div>
        </div>
        <form method="POST" id="configForm">
            <label class="toggle-setting">
                <div>
                    <strong>Notificaciones</strong>
                    <small>Recibir avisos de nuevas alertas</small>
                </div>
                <input type="checkbox" name="notificaciones" {% if config.notificaciones %}checked{% endif %}>
                <span class="toggle"></span>
            </label>
            <label class="toggle-setting">
                <div>
                    <strong>Actualización automática</strong>
                    <small>Actualizar datos automáticamente</small>
                </div>
                <input type="checkbox" name="auto_update" {% if config.auto_update %}checked{% endif %}>
                <span class="toggle"></span>
            </label>
            <label class="toggle-setting">
                <div>
                    <strong>Ubicación</strong>
                    <small>Compartir ubicación para alertas por cercanía</small>
                </div>
                <input type="checkbox" name="ubicacion" {% if config.ubicacion %}checked{% endif %}>
                <span class="toggle"></span>
            </label>
            <button type="submit" class="btn" style="margin-top:16px;">Guardar preferencias</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('configForm').addEventListener('submit', function() {
        const ubicacionCheck = document.querySelector('input[name="ubicacion"]');
        if (ubicacionCheck && window.setUbicacion) {
            window.setUbicacion(ubicacionCheck.checked);
        }
    });
</script>
{% endblock %}
