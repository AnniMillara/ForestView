{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="login-container" style="max-width:450px;">
    <div class="login-logo">
        <img src="{{ url_for('static', filename='img/logo_forestguard.png') }}" alt="ForestGuard" height="60">
    </div>
    <h2>Crear cuenta</h2>
    <p class="subtitle">Regístrate para acceder al sistema</p>
    <form method="POST">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Nombre de usuario</label>
            <input type="text" name="nombre_usuario" placeholder="Elige un nombre de usuario" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" name="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-user-circle"></i> Nombre completo</label>
            <input type="text" name="nombre_completo" placeholder="Tu nombre y apellidos" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Contraseña</label>
            <input type="password" name="contrasena" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Confirmar contraseña</label>
            <input type="password" name="confirmar" placeholder="Repite tu contraseña" required>
        </div>
        <button type="submit"><i class="fas fa-user-plus"></i> Registrarse</button>
    </form>
    <div style="margin-top:15px; text-align:center;">
        <p style="font-size:12px; color:#718078;">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color:#0b4d26; font-weight:600;">Inicia sesión</a>
        </p>
    </div>
    <p class="aviso">Al registrarte, aceptas que tu cuenta sea gestionada por un administrador.</p>
</div>
{% endblock %}
